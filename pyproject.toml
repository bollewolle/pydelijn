[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pydelijn"
version = "2.0.1"
description = "Async client for De Lijn (Flemish public transport) open data API"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "bollewolle", email = "dev@bollewolle.be" }]
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.9"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Framework :: AsyncIO",
]

# aiohttp<3.14 is pinned for tests only: aioresponses 0.7.9 (latest on PyPI)
# mocks aiohttp.ClientResponse.__init__() and breaks against aiohttp>=3.14,
# which added a required stream_writer kwarg. The runtime dependency above
# stays unbounded.
[project.optional-dependencies]
test = [
    "pytest",
    "pytest-asyncio",
    "aioresponses",
    "ruff",
    "mypy",
    "aiohttp<3.14",
]

[project.urls]
Homepage = "https://github.com/bollewolle/pydelijn"
Repository = "https://github.com/bollewolle/pydelijn"

[tool.setuptools.package-data]
pydelijn = ["py.typed"]

[tool.setuptools.packages.find]
include = ["pydelijn*"]
exclude = ["tests*"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "D"]
[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unreachable = true
show_error_codes = true
show_column_numbers = true
pretty = true

[[tool.mypy.overrides]]
module = "aioresponses"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
